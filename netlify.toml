[build]
  publish = "."
  # _unused/ and _build/ excluded via .gitignore (Netlify-from-Git only deploys tracked files)

# Redirect HTTP → HTTPS
[[redirects]]
  from = "http://argamanclinic.com/*"
  to   = "https://argamanclinic.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "http://www.argamanclinic.com/*"
  to   = "https://argamanclinic.com/:splat"
  status = 301
  force  = true

# www → non-www
[[redirects]]
  from = "https://www.argamanclinic.com/*"
  to   = "https://argamanclinic.com/:splat"
  status = 301
  force  = true

